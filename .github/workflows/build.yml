name: Build & Release CobbleTower Mod JAR

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Mod with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CobbleTower-1.3.0-JAR
          path: build/libs/*.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.0' }}
          name: "CobbleTower v1.3.0 - Definitive Roguelike Double Battle Tower Overhaul"
          draft: false
          prerelease: false
          body: |
            # 🗼 CobbleTower v1.3.0 Definitive Release (Fabric 1.21.1)

            Bản cập nhật lớn toàn diện **CobbleTower v1.3.0** cho Cobblemon Minecraft 1.21.1 mang đến trải nghiệm Đấu Trường VGC 100 Tầng đỉnh cao.

            ### 🌟 Tính Năng & Sửa Lỗi Nổi Bật trong v1.3.0:
            1. **Tích Hợp Toàn Diện Hell Mode (1.663 Trainers & Bể 861 Team Pool):**
               - Đồng bộ 1.663 hồ sơ Trainer và 861 đội hình thi đấu chuẩn Hell Mode cho cả Overworld và Tower.
               - Tự động ép thể thức `GEN_9_DOUBLES` 2v2 và cấu hình AI thông minh (Smart Switching, Move Bias, Stat Move Setup).
            2. **Bypass Rào Cản Cốt Truyện & Kích Hoạt Đấu Trực Tiếp:**
               - Bỏ qua toàn bộ hạn chế huy hiệu của RCTMod trong Tháp, click NPC là vào trận và xuất Pokémon ngay ở Turn 0.
            3. **Boss Floor Cutscenes Hoành Tráng:**
               - Hiệu ứng Letterbox điện ảnh, âm thanh tiếng gầm Boss và danh hiệu phát sáng tại các tầng mốc 10, 25, 50, 75, 90, 91–99, 100.
            4. **Hệ Thống Xếp Hạng Grade Sau Trận (Rank S/A/B/C/D):**
               - Đánh giá hiệu suất trận đấu dựa trên số turn và số Pokémon ngất (Rank S cộng +25% BP).
            5. **Bảng Vinh Danh Leaderboard & Prestige Ascension:**
               - Ghi nhận Top 10 kỷ lục hoàn thành True Run Floor 100 nhanh nhất (`/tower leaderboard`).
               - Thăng cấp Prestige (`/tower prestige`) nhận vĩnh viễn hệ số nhân BP (+5%/cấp) và hiệu ứng hạt hào quang.
            6. **Lưu Trữ Dữ Liệu Cách Ly Theo Từng World:**
               - Tiến trình tháp và checkpoint được lưu riêng biệt theo từng thư mục `saves/<world>/cobbletower_data/`.
            7. **Shop BP Đầy Đủ Vật Phẩm Thi Đấu & Restock Theo Tuần:**
               - Bottle Cap, Tera Shard, Mint, Ability Patch, Mega Stones, giáp tiến hóa và đồ thi đấu VGC.

            ### 📦 Cài Đặt:
            - Yêu cầu: Fabric Loader >= 0.16.0, Minecraft 1.21.1, Cobblemon >= 1.7.0, Java 21.
            - Tải file `.jar` bên dưới và đặt vào thư mục `.minecraft/mods/`.
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
