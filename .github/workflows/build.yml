name: Build & Release CobbleTower Mod JAR

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Mod with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CobbleTower-1.3.0-JAR
          path: build/libs/*.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.0' }}
          name: "CobbleTower v1.3.0 - Definitive Roguelike Battle Tower Overhaul"
          draft: false
          prerelease: false
          body: |
            # 🗼 CobbleTower v1.3.0 Definitive Release (Fabric 1.21.1)

            Bản cập nhật lớn toàn diện **CobbleTower v1.3.0** cho Cobblemon Minecraft 1.21.1 mang đến trải nghiệm Đấu Trường VGC 100 Tầng đỉnh cao.

            ### 🌟 Tính Năng & Đổi Mới Nổi Bật trong v1.3.0:
            1. **Arena Curses & Dual Curse Matrix:**
               - Cân bằng lại Ironclad (15%) và Retaliation (10%, max 20% HP).
               - 4 Lời nguyền mới: *Temporal Decay, Silence, Gravity Well, Famine*.
               - Ma trận **10 cặp Dual Curses cố định** cho tầng Sovereign Boss (F91–100).
            2. **Ghost Support Protocol (Co-op Spectator):**
               - Năng lượng Ghost Charges theo chặng: 2⚡ (F1–50), 3⚡ (F51–75), 4⚡ (F76–100).
               - Kỹ năng thứ 4: `[V]` **Spectral Insight** soi điểm yếu và chỉ số đối thủ.
               - Heal Pulse tỷ lệ hồi máu theo chặng (15% ➔ 30% Max HP).
            3. **Luật Đấu Cạnh Tranh & Anti-Cheese:**
               - Tự động áp dụng Evasion, OHKO, Moody, và Swagger Clauses.
               - Kiểm soát Species Clause, Item Clause, và Legendary Tiering Caps.
            4. **Hệ Thống Difficulty Profiles:**
               - Tùy chọn cấu hình server: `CASUAL`, `STANDARD`, `HARDCORE`.
            5. **Cửa Hàng BP 4 Bậc:**
               - Bronze, Silver (F50), Gold (F100), và Platinum (Prestige 3+) với danh hiệu độc quyền `« Tower Legend »`.
            6. **Đầy Đủ Hệ Thống Lệnh (`/tower`):**
               - `/tower start`, `/tower solo`, `/tower checkpoint <floor>`, `/tower duo <player>`, `/tower pause`, `/tower resume`, `/tower stats`, `/tower forfeit`, `/tower reload`.

            ### 📦 Cài Đặt:
            - Yêu cầu: Fabric Loader >= 0.16.0, Minecraft 1.21.1, Cobblemon >= 1.7.0.
            - Tải file `.jar` bên dưới và đặt vào thư mục `.minecraft/mods/`.
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
