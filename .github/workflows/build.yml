name: Build & Release CobbleTower Mod JAR

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Mod with Gradle
        run: gradle build --no-daemon

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CobbleTower-1.0.0-JAR
          path: build/libs/*.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.0
          name: "CobbleTower v1.0.0 - Solo 2-Slot & Duo Co-op 100 Floors"
          draft: false
          prerelease: false
          body: |
            ## 🗼 CobbleTower v1.0.0 Release (Fabric 1.21.1)

            Bản mở rộng tháp đấu trường 100 tầng Roguelike dành cho modpack **COBBLEVERSE**.

            ### 🎮 Các Tính Năng Nổi Bật:
            - **Thể Thức Đấu Đôi (Double Battle):**
              - *Solo Mode (2-Slot):* 1 người chơi điều khiển cả 2 vị trí trên sân.
              - *Duo Mode (2v1):* 2 người chơi hợp tác, hỗ trợ cơ chế *2-Slot Takeover* khi một người ngất hết Pokemon.
            - **Giao Diện Command-Free:**
              - Mở **Tower Hub Dashboard** bằng phím nóng **[Y]** hoặc tương tác khối **Cổng Tháp (Tower Gateway)**.
              - Mời bạn bè trực tiếp qua Shift + Chuột phải hoặc GUI Hub (Toast Notification).
            - **Hệ Thống Level Cap Theo Chặng:**
              - Tầng 1-25: Max Lv.36
              - Tầng 26-50: Max Lv.50
              - Tầng 51-75: Max Lv.80
              - Tầng 76-100: Max Lv.100
            - **NPC Boss Tăng Cường:**
              - Toàn bộ Boss sở hữu **Full 6x31 IVs**.
              - Từ tầng 51 đến 100: Mỗi Boss sở hữu ít nhất 1 Pokemon Shiny.
            - **Tầng Nghỉ (Rest Floor - Mỗi 5 tầng):**
              - Chọn 1 trong 2 quyền lợi: Hồi phục sinh lực (10% HP ngất, 50% HP sống, 100% PP) hoặc Rương Quà Quý.

            ### 📦 Hướng Dẫn Cài Đặt:
            1. Tải file **`CobbleTower-1.0.0.jar`** bên dưới phần Assets.
            2. Thả vào thư mục `.minecraft/mods`.
            3. Yêu cầu: Fabric Loader 0.16.5+, Fabric API, Minecraft 1.21.1, Cobblemon 1.7.3+.
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
