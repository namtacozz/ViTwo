name: Build & Release CobbleTower Mod JAR

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Mod with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CobbleTower-1.3.0-JAR
          path: build/libs/*.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.0' }}
          name: "CobbleTower v1.3.0 - Definitive Roguelike Battle Tower Overhaul"
          draft: false
          prerelease: false
          body: |
            # 🗼 CobbleTower v1.3.0 Definitive Release (Fabric 1.21.1)

            Bản cập nhật lớn toàn diện **CobbleTower v1.3.0** cho Cobblemon Minecraft 1.21.1 mang đến trải nghiệm Đấu Trường VGC 100 Tầng đỉnh cao.

            ### 🌟 Tính Năng & Sửa Lỗi Nổi Bật trong v1.3.0:
            1. **Triệu Hồi 1,559 RCT Trainers Đa Dạng & Bypass Cốt Truyện:**
               - Tích hợp kho dữ liệu 1,559 NPC Trainer phân theo 6 bậc độ khó.
               - Tự động spawn Trainer NPC trong sàn đấu và khởi tạo trận đấu trực tiếp khi tương tác.
            2. **An Toàn Bề Mặt & Sửa Lỗi Kẹt Trục Z:**
               - Tự động dò tìm bề mặt sàn đấu và Overworld, lấp đầy nền tảng Deepslate an toàn, loại bỏ triệt để việc kẹt trong lòng đất hoặc rớt vào hố ở Tầng 100.
            3. **Hoạt Ảnh 3D Pokémon Trong Team Preview:**
               - Hiển thị mô hình 3D Animated của Cobblemon cho cả đội hình đối thủ và người chơi. Hỗ trợ hoán đổi vị trí Lead & Bench mượt mà.
            4. **Hiển Thị Item Icon Trong Shop BP:**
               - Hiển thị trực quan Icon của Mint, Bottle Cap, Tera Shard, Master Ball và các phần thưởng đặc biệt.
            5. **Giao Diện Thẻ Rest Station Xuống Dòng Rõ Ràng:**
               - Thiết kế lại màn hình Rest Station với 3 Thẻ Lựa Chọn kèm gạch đầu dòng đặc tả chi tiết.
            6. **HUD Tự Động Co Giãn & Menu Dev Cheat Test:**
               - Viền HUD sắc nét, tự co giãn theo độ dài tên Affix/Boss. Thêm đủ 6 mốc Checkpoint và thanh công cụ Dev Test hỗ trợ nhảy tầng nhanh.
            7. **Arena Curses, Dual Curse Matrix, và Anti-Cheese VGC Clauses.**

            ### 📦 Cài Đặt:
            - Yêu cầu: Fabric Loader >= 0.16.0, Minecraft 1.21.1, Cobblemon >= 1.7.0.
            - Tải file `.jar` bên dưới và đặt vào thư mục `.minecraft/mods/`.
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
