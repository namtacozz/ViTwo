plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Cobblemon"
        url = "https://maven.impactdev.net/repository/development/"
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Cobblemon
    modImplementation("com.cobblemon:fabric:${project.cobblemon_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }

    // Fabric Language Kotlin (provides Kotlin stdlib and functional interfaces for Fabric IDEs)
    modImplementation "net.fabricmc:fabric-language-kotlin:1.11.0+kotlin.2.0.0"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.register('deployToPrism', Copy) {
    dependsOn 'remapJar'
    from tasks.named('remapJar')
    into file("${System.getProperty('user.home')}/.local/share/PrismLauncher/instances/COBBLEVERSE - Pokemon Adventure [Cobblemon]/minecraft/mods")
    onlyIf {
        file("${System.getProperty('user.home')}/.local/share/PrismLauncher/instances/COBBLEVERSE - Pokemon Adventure [Cobblemon]/minecraft/mods").exists()
    }
    
    doLast {
        println ">>> [AUTO-DEPLOY] Successfully copied CobbleTower JAR to PrismLauncher mods directory! <<<"
    }
}

tasks.named('remapJar') {
    finalizedBy 'deployToPrism'
}

tasks.named('build') {
    finalizedBy 'deployToPrism'
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}
